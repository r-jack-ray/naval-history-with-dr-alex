# Shared settings for site generation, builds, and rendered-site validation.
# Values already present in the calling environment take precedence.

# Astro pages rendered concurrently. Accepted values: 1, 2, 3, or 4.
ASTRO_BUILD_CONCURRENCY=4

# HTML files inspected concurrently by check:site-seo. Accepted values: 1-32.
SITE_SEO_VALIDATION_CONCURRENCY=8
